name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: the job only reads the checkout.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # GitHub never re-creates a cancelled run, so only PR runs are cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate JSON manifests
        run: |
          set -euo pipefail
          status=0
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json .mcp.json hooks/hooks.json; do
            if jq -e . "$f" >/dev/null; then
              echo "ok    $f"
            else
              echo "INVALID $f"
              status=1
            fi
          done
          exit "$status"

      - name: Check plugin.json component paths exist
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          manifest = json.load(open(".claude-plugin/plugin.json"))
          missing = []
          def check(value):
              if isinstance(value, str):
                  if not os.path.exists(value):
                      missing.append(value)
              elif isinstance(value, list):
                  for item in value:
                      check(item)
          for key in ("skills", "agents", "hooks", "mcpServers", "commands"):
              if key in manifest:
                  check(manifest[key])
          for skill_md in sorted(os.path.join(r, "SKILL.md") for r, _, files in os.walk("skills") if "SKILL.md" in files):
              print(f"skill  {skill_md}")
          if missing:
              print("plugin.json references paths that do not exist:", *missing, sep="\n  ")
              sys.exit(1)
          print("ok     all plugin.json component paths exist")
          PY

      - name: Check public files
        run: python3 -B scripts/check-public-files.py

      - name: Check publisher metadata
        run: python3 -B scripts/check-publisher-metadata.py

      - name: Approval policy and publication regression tests
        run: python3 -B -m unittest discover -s tests -v

      - name: Verify hook isolation in a synthetic host environment
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile

          root = Path.cwd()
          config = json.loads((root / "hooks/hooks.json").read_text())
          hook = config["hooks"]["PreToolUse"][0]["hooks"][0]
          with tempfile.TemporaryDirectory() as tmp:
              marker = Path(tmp) / "startup-ran"
              injected = f"open({str(marker)!r}, 'w').close()\nraise SystemExit(97)\n"
              startup = Path(tmp) / "startup.py"
              startup.write_text(injected)
              for name in ("sitecustomize.py", "usercustomize.py", "json.py"):
                  (Path(tmp) / name).write_text(injected)
              # Synthetic values only; never inspect or copy the runner's credentials.
              child_settings = {
                  "PATH": tmp,
                  "PYTHONSTARTUP": str(startup),
                  "PYTHONPATH": tmp,
                  "PYTHONHOME": tmp,
                  "PYTHONUSERBASE": tmp,
              }
              payload = json.dumps({"tool_name": "mcp__leadmagic__set_sheet_cells"})
              install = Path(tmp) / "LeadMagic plugin with spaces"
              (install / "scripts").mkdir(parents=True)
              shutil.copyfile(root / "scripts/approval-policy.py", install / "scripts/approval-policy.py")
              for plugin_root in (root, install):
                  for ask_all in ("false", "true"):
                      command = [part.replace("${CLAUDE_PLUGIN_ROOT}", str(plugin_root))
                                 .replace("${user_config.ask_all}", ask_all)
                                 for part in [hook["command"], *hook["args"]]]
                      result = subprocess.run(command, input=payload, text=True,
                                              env=child_settings, cwd=tmp, capture_output=True, check=True)
                      assert result.stderr == "", result.stderr
                      assert not marker.exists(), "interpreter startup override executed"
                      if ask_all == "true":
                          assert result.stdout == "", result.stdout
                      else:
                          assert json.loads(result.stdout)["hookSpecificOutput"]["permissionDecision"] == "ask"
          print("Hook ignores startup overrides, needs no PATH tools, and supports install paths with spaces.")
          PY

      - name: Parse skill, command, and agent frontmatter as strict YAML
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml==6.0.2
          python3 - <<'PY'
          import glob, re, sys, yaml
          bad = []
          files = glob.glob("skills/*/SKILL.md") + glob.glob("commands/*.md") + glob.glob("agents/*.md")
          for f in sorted(files):
              m = re.match(r"^---\n(.*?)\n---\n", open(f, encoding="utf-8").read(), re.S)
              if not m:
                  bad.append(f"{f}: missing frontmatter"); continue
              try:
                  d = yaml.safe_load(m.group(1))
              except yaml.YAMLError as e:
                  bad.append(f"{f}: {e}"); continue
              for k, v in d.items():
                  if k != "tools" and not isinstance(v, (str, bool, int)):
                      bad.append(f"{f}: {k} must be a single value, got {v!r}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print(f"ok    frontmatter: {len(files)} files")
          PY

      - name: Check relative Markdown links
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          link_re = re.compile(r"(?<!!)\[[^\]]*\]\(([^)\s]+)(?:\s+\"[^\"]*\")?\)")
          skip = ("http://", "https://", "mailto:", "#", "tel:")
          broken = []
          checked = 0
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in (".git", "node_modules")]
              for name in files:
                  if not name.endswith(".md"):
                      continue
                  md = os.path.join(root, name)
                  text = open(md, encoding="utf-8").read()
                  for target in link_re.findall(text):
                      if target.startswith(skip) or "${" in target or target.startswith("<"):
                          continue
                      rel = target.split("#", 1)[0]
                      if not rel:
                          continue
                      resolved = os.path.normpath(os.path.join(root, rel))
                      checked += 1
                      if not os.path.exists(resolved):
                          broken.append(f"{md}: {target}")
          print(f"checked {checked} relative links")
          if broken:
              print("broken relative links:", *broken, sep="\n  ")
              sys.exit(1)
          PY
