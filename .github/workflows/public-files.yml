name: Public file safety
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Checks live inline: the plugin directory refuses script files from unverified publishers.
      - name: Check public files for credentials
        run: |
          python3 -B - <<'PY'
          """Check tracked/public files without printing credential values. No network calls."""
          from pathlib import Path
          import re
          import subprocess
          import sys

          root = Path.cwd()
          paths = subprocess.check_output(
              ["git", "ls-files", "--cached", "--others", "--exclude-standard", "-z"], cwd=root
          ).decode().split("\0")
          rules = {
              "private-key": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "leadmagic-key": re.compile(r"\blm_[A-Za-z0-9]{24,}\b"),
              "github-token": re.compile(r"\b(?:gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{50,})\b"),
              "cloud-key": re.compile(r"\b(?:AKIA|ASIA)[A-Z0-9]{16}\b"),
              "stripe-secret": re.compile(r"\b(?:sk|rk)_live_[A-Za-z0-9]{24,}\b"),
          }
          issues = []
          for name in sorted(set(paths)):
              if not name:
                  continue
              path = root / name
              if not path.is_file() or path.is_symlink():
                  continue
              if path.name == ".env" or (path.name.startswith(".env.") and path.name not in (".env.example", ".env.sample", ".env.template")):
                  issues.append(f"{name}: environment file must not be published")
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              text = data.decode("utf-8", errors="replace")
              for number, line in enumerate(text.splitlines(), 1):
                  for label, rule in rules.items():
                      if rule.search(line):
                          issues.append(f"{name}:{number}: possible {label} (value omitted)")
          if issues:
              print("Public-file checks failed:", *issues, sep="\n")
              sys.exit(1)
          print("Public-file checks passed. Pattern checks supplement manual review and secret scanning.")
          PY
      - name: Check publisher metadata
        run: |
          python3 -B - <<'PY'
          """Check that plugin, marketplace, and LICENSE name the same publisher and version."""
          from pathlib import Path
          import json
          import re
          import sys

          root = Path.cwd()
          issues = []
          publisher = "LeadMagic Corporation"
          try:
              plugin = json.loads((root / ".claude-plugin/plugin.json").read_text())
              marketplace = json.loads((root / ".claude-plugin/marketplace.json").read_text())
              identities = [("plugin author", plugin.get("author", {}).get("name")),
                            ("marketplace owner", marketplace.get("owner", {}).get("name"))]
              entries = marketplace.get("plugins", [])
              if len(entries) != 1:
                  issues.append("marketplace must list exactly one LeadMagic plugin")
              for entry in entries:
                  identities.append(("marketplace plugin author", entry.get("author", {}).get("name")))
                  if entry.get("version") != plugin.get("version"):
                      issues.append("marketplace plugin version must match plugin.json")
              for label, name in identities:
                  if name != publisher:
                      issues.append(f"{label} must be {publisher}")
              if plugin.get("displayName") != "LeadMagic":
                  issues.append("plugin product displayName must remain LeadMagic")
              if marketplace.get("metadata", {}).get("version") != plugin.get("version"):
                  issues.append("marketplace metadata version must match plugin.json")
              if not re.search(r"^Copyright \(c\) \d{4} LeadMagic Corporation$", (root / "LICENSE").read_text(), re.M):
                  issues.append("LICENSE copyright holder must be LeadMagic Corporation")
          except (OSError, ValueError, TypeError, AttributeError):
              issues.append("publisher metadata could not be validated")
          if issues:
              print("Publisher metadata checks failed:", *issues, sep="\n")
              sys.exit(1)
          print("Publisher metadata checks passed.")
          PY
      - name: Check directory-allowed file types
        run: |
          python3 -B - <<'PY'
          """The Claude plugin directory refuses unverified publishers' files outside these types."""
          import subprocess, sys
          from pathlib import Path
          ALLOWED = (".md", ".txt", ".json", ".yaml", ".yml", ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico")
          EXEMPT = {"LICENSE", ".gitignore"}
          PM_CONFIGS = {"package.json", "package-lock.json", "pnpm-workspace.yaml", "pnpm-lock.yaml", "yarn.lock", "bun.lockb", "bun.lock", ".npmrc", ".yarnrc.yml"}
          bad = []
          for name in subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0"):
              if not name:
                  continue
              p = Path(name)
              data = p.read_bytes()
              if name not in EXEMPT and not name.lower().endswith(ALLOWED):
                  bad.append(f"{name}: type not allowed by the plugin directory")
              if p.name in PM_CONFIGS:
                  bad.append(f"{name}: package manager configuration")
              if data.startswith(b"#!"):
                  bad.append(f"{name}: starts with #!")
              if not name.lower().endswith((".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico")):
                  if b"\0" in data:
                      bad.append(f"{name}: contains NUL bytes")
                  try:
                      data.decode("utf-8")
                  except UnicodeDecodeError:
                      bad.append(f"{name}: not UTF-8")
          if bad:
              print("Directory file-type checks failed:", *bad, sep="\n")
              sys.exit(1)
          print("Directory file-type checks passed.")
          PY
